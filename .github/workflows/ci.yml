name: AURA local quality checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Midnight Compact toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          "$HOME/.local/bin/compact" update 0.31.1
          "$HOME/.local/bin/compact" compile --version

      - name: Compile Compact source from scratch
        run: compact compile contracts/anonymous_survey.compact "$RUNNER_TEMP/aura-compact-artifacts"

      - name: Verify committed Compact source and artifacts
        run: npm run contract:check

      - name: Run contract, API, and browser-surface tests
        run: npm test

      - name: Verify Web Build Artifacts
        run: npm run build
