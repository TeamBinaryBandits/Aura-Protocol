name: AURA local quality checks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (Node 22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify included Compact source
        run: npm run contract:check

      - name: Run contract, API, and browser-surface tests
        run: npm test

      - name: Verify Web Build Artifacts
        run: npm run build
